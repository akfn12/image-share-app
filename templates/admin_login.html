<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 인증</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h4>관리자 인증</h4>
                    </div>
                    <div class="card-body">
                        {% if error %}
                            <div class="alert alert-danger">{{ error }}</div>
                        {% endif %}
                        
                        <form action="{{ url_for('admin_login') }}" method="POST">
                            <div class="mb-3">
                                <label for="adminCode" class="form-label">관리자 인증 코드</label>
                                <input type="password" class="form-control" name="code" id="adminCode" required>
                                
                                </div>
                            <button type="submit" class="btn btn-success w-100">인증</button>
                        </form>
                        <hr>
                        <a href="{{ url_for('index') }}" class="btn btn-secondary w-100">메인으로 돌아가기</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
